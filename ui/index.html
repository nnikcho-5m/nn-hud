<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kn-hud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="
        https://cdn.jsdelivr.net/npm/phosphor-icons@1.4.2/src/css/icons.min.css
        " rel="stylesheet">
           <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>

        .bar-track {
            background: rgba(20,22,26,0.75);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .bar-track::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                90deg, transparent, transparent 7px,
                rgba(0, 0, 0, 0.342) 7px, rgba(0,0,0,0.342) 8px
            );
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="mainHUD" class="transition-all duration-300 " style="display:none;">
        <div id="playerHUD" class="absolute bottom-[65px] left-0 flex flex-row gap-8 ml-6 select-none">
            <div class="relative">
                <div class="absolute w-[295px] h-4 border border-sky-600 bg-[rgba(20,22,26)] absolute bottom-[65px] ml-8 left-0 rounded-[3px]">
                    <div class="bar-track h-full w-40 bg-gradient-to-r from-sky-400 to-sky-600" id="armor-bar"></div>
                </div>
                <i class="material-symbols-outlined text-white/90 absolute bottom-[62px] left-1" style=" text-shadow:
                -1px -1px 0 rgba(0, 0, 0, 0.479),
                1px -1px 0 rgba(0, 0, 0, 0.432),
                -1px  1px 0 rgba(0, 0, 0, 0.425), 
                1px  1px 0 rgba(0, 0, 0, 0.473);">shield</i>
                <div class="absolute w-[295px] h-4 border border-green-600 bg-[rgba(20,22,26,0.90)]  absolute bottom-[95px] ml-8 left-0 rounded-[3px]">
                    <div class="bar-track h-full w-60 bg-green-400" id="health-bar" ></div>
                </div>
                <i class="material-symbols-outlined absolute text-white/90 bottom-[90px] left-1 " style=" text-shadow:
                -1px -1px 0 rgba(0, 0, 0, 0.479),
                1px -1px 0 rgba(0, 0, 0, 0.432),
                -1px  1px 0 rgba(0, 0, 0, 0.425), 
                1px  1px 0 rgba(0, 0, 0, 0.473);">favorite</i>
            </div>
            <div class="relative w-14 h-14 bg-[rgba(20,22,26,0.80)] overflow-hidden flex items-center justify-center rounded-[26px] border border-black/20">
                <div id="mic-bar" class="w-14 h-10 bg-[#4a7fa5] absolute bottom-0 left-0 transition-all duration-300"></div>
                <i id="mic-icon" class="material-symbols-outlined select-none text-[32px] text-white z-10"  style=" text-shadow:
                  -1px -1px 0 rgba(0, 0, 0, 0.932),
                 1px -1px 0 rgba(0, 0, 0, 0.932),
                -1px  1px 0 rgba(0, 0, 0, 0.932),
                 1px  1px 0 rgba(0, 0, 0, 0.932);">mic</i>
            </div>
            <div class="relative w-14 h-14 bg-[rgba(20,22,26,0.80)] overflow-hidden flex items-center justify-center rounded-[26px] border border-black/20"> <!-- hunger -->
                <div class="w-14 h-9 bg-[#b07540] absolute bottom-0 left-0 transition-all duration-300" id="hunger-bar"></div>
                <i class="material-symbols-outlined select-none text-[24px] text-gray-100/90 z-10" style=" text-shadow:
                  -1px -1px 0 rgba(0,0,0,0.65),
                 1px -1px 0 rgba(0,0,0,0.60),
                -1px  1px 0 rgba(0,0,0,0.60),
                 1px  1px 0 rgba(0,0,0,0.65);">restaurant</i>
            </div>
            <div class="relative w-14 h-14 bg-[rgba(20,22,26,0.80)] overflow-hidden flex items-center justify-center rounded-[26px] border border-black/20"> <!-- water -->
                <div class="w-14 h-4 bg-[#3d7a8a] absolute bottom-0 left-0 transition-all duration-300 " id="water-bar"></div>
                <i class="material-symbols-outlined select-none text-[30px] text-gray-100/90 z-10" style=" text-shadow:
                  -1px -1px 0 rgba(0,0,0,0.65),
                 1px -1px 0 rgba(0,0,0,0.60),
                -1px  1px 0 rgba(0,0,0,0.60),
                 1px  1px 0 rgba(0,0,0,0.65);">water_drop</i>
            </div>
            <div class="relative w-14 h-14 bg-[rgba(20,22,26,0.80)] overflow-hidden flex items-center justify-center rounded-[26px]  border border-black/20"> <!-- water -->
                <div class="w-14 h-7 bg-[#6b8f4e] absolute bottom-0 left-0 transition-all duration-300" id="stamina-bar">
                </div>
                
                <i class="material-symbols-outlined select-none text-[30px] text-gray-100/90 z-10" style="
                text-shadow:
                 -1px -1px 0 rgba(0,0,0,0.65),
                 1px -1px 0 rgba(0,0,0,0.60),
                -1px  1px 0 rgba(0,0,0,0.60),
                 1px  1px 0 rgba(0,0,0,0.65); ">sprint</i>
            </div>
        </div>
        <div class="carHUD" id="carHUD">
            <div class="bg-[rgba(20,22,26,0.99)] rounded-xl w-[300px] h-40 absolute bottom-20 right-20 border-2 border-[rgba(255,255,255,0.07)]">   
            <div id="seatbelt"><i class="material-symbols-outlined text-md absolute bottom-[15px] right-[25px]">tatami_seat</i></div>
            <span id="gear" class="bg-[rgba(56,182,255,0.08)] border border-[rgba(56,182,255,0.2)] rounded-full px-3 text-[#38b6ff] text-2xl font-bold py-1 absolute top-[30px] right-[70px]">1</span>
                <div class="flex flex-col items-end gap-3 select-none">
                    <div class="flex items-end gap-3 absolute top-[50px] left-[20px]">
                        <p id="speed" class="text-gray-100 text-5xl font-bold font-['Exo 2', sans-serif]" style="
                        text-shadow:
                        -1px -1px 0 rgba(0,0,0,0.65),
                        1px -1px 0 rgba(0,0,0,0.60),
                        -1px  1px 0 rgba(0,0,0,0.60),
                        1px  1px 0 rgba(0,0,0,0.65); ">
                            0
                        </p>
                        <p class="text-gray-300/70 mb-1 font-bold text-md font-['Exo 2', sans-serif]" style="
                        text-shadow:
                        -1px -1px 0 rgba(0,0,0,0.65),
                        1px -1px 0 rgba(0,0,0,0.60),
                        -1px  1px 0 rgba(0,0,0,0.60),
                        1px  1px 0 rgba(0,0,0,0.65); ">KM/H</p>
                    </div>
                    <div class="absolute bottom-[15px] left-[20px]">
                        <div class="w-[200px] h-2 bg-[rgba(20,22,26)] rounded-[2px] border border-white/10 overflow-hidden mr-10">
                            <div id="rpm-bar" class="bar-track h-full w-10 bg-gradient-to-r from-[rgba(56,182,255,0.1)] to-[#38b6ff7d] transition-all duration-300"></div>
                        </div>
                        <div class="flex items-center gap-2 mr-10">
                            <i class="material-symbols-outlined text-gray-300/80 text-base">local_gas_station</i>
                            <div class="h-2 w-44 bg-[rgba(20,22,26)] rounded-[2px] border border-white/10 overflow-hidden">
                                <div id="fuel" class="bar-track h-full w-20 bg-gradient-to-r from-gray-400 to-neutral-500 transition-all duration-300"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div> 
        </div>
        <div id="heliHUD" class="absolute bottom-[60px] right-[70px]">
            <div class="bg-[rgba(20,22,26,0.99)] p-3 border-2 border-[rgba(56,182,255,0.2)] rounded-xl">
                <div class="flex flex-row gap-3 items-center border-b-2 border-dashed border-[rgba(56,182,255,0.2)] mb-2">
                    <div id="heli-speed" class="text-white text-[45px] font-bold" style=" text-shadow:
                    -1px -1px 0 rgba(0, 0, 0, 0.479),
                    1px -1px 0 rgba(0, 0, 0, 0.432),
                    -1px  1px 0 rgba(0, 0, 0, 0.425), 
                    1px  1px 0 rgba(0, 0, 0, 0.473);">0</div>
                    <div class="text-gray-300 text-2xl font-bold mt-4" style=" text-shadow:
                    -1px -1px 0 rgba(0, 0, 0, 0.479),
                    1px -1px 0 rgba(0, 0, 0, 0.432),
                    -1px  1px 0 rgba(0, 0, 0, 0.425), 
                    1px  1px 0 rgba(0, 0, 0, 0.473);">KM/H</div>
                </div>
                <div class="flex flex-row gap-3 items-center border-b-2 border-dashed border-[rgba(56,182,255,0.2)] mb-2">
                    <div id="heli-altitude" class="text-white text-[45px] font-bold" style=" text-shadow:
                    -1px -1px 0 rgba(0, 0, 0, 0.479),
                    1px -1px 0 rgba(0, 0, 0, 0.432),
                    -1px  1px 0 rgba(0, 0, 0, 0.425), 
                    1px  1px 0 rgba(0, 0, 0, 0.473);">0</div>
                    <div class="text-gray-300 text-2xl font-bold mt-2" style=" text-shadow:
                    -1px -1px 0 rgba(0, 0, 0, 0.479),
                    1px -1px 0 rgba(0, 0, 0, 0.432),
                    -1px  1px 0 rgba(0, 0, 0, 0.425), 
                    1px  1px 0 rgba(0, 0, 0, 0.473);">ALT</div>
                </div>
                <div class="flex items-center gap-2">
                    <i class="material-symbols-outlined text-gray-300/80 text-xl">local_gas_station</i>
                    <div class="h-3 w-44 bg-[rgba(20,22,26)] rounded-[3px] border border-white/10 overflow-hidden">
                        <div id="fuelHeli" class="bar-track h-full w-20 bg-gradient-to-r from-gray-400 to-neutral-500 transition-all duration-300"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
